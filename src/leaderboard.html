<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeedFriending Leaderboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="leaderboard.css">

    <!-- tsParticles -->
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>

    <!-- Firebase Modular SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Date Adapter for time scale -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
</head>
<body>
    <div id="tsparticles"></div>
    
    <div class="leaderboard-container">
        <div class="header">
            <button class="back-btn" onclick="window.location.href='/game'">← Back to Game</button>
            <h1>🏆 Class Leaderboard</h1>
            <div class="class-info" id="classInfo">Loading...</div>
        </div>

        <div class="content-grid">
            <!-- Leaderboard List -->
            <div class="leaderboard-section">
                <h2>🎯 Top Scorers</h2>
                <div class="leaderboard-list" id="leaderboardList">
                    <div class="loading-spinner">Loading leaderboard...</div>
                </div>
            </div>

            <!-- Charts Section -->
            <div class="charts-section">
                <div class="chart-container">
                    <h3>📊 Top 5 Bar Chart</h3>
                    <canvas id="barChart"></canvas>
                </div>
                
                <div class="chart-container">
                    <h3>📈 Points Progress Over Time</h3>
                    <canvas id="lineChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script src="leaderboard.js"></script>
</body>
</html>
